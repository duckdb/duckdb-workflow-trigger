name: DuckDB Workflow Trigger
on:
  workflow_dispatch:
    inputs:
      # Git ref of the duckdb repo
      duckdb-ref:
        required: true
        type: string
      trigger-nightly:
        required: true
        type: boolean
      skip_tests:
        required: false
        type: boolean
        default: false
  schedule:
    # Start 10 minutes before whole hours to avoid the hourly queue spike.
    - cron: "50 2 * * *"
      timezone: Europe/Amsterdam
    # Runs without tests warm the CI caches.
    - cron: "50 9 * * 1-5"
      timezone: Europe/Amsterdam
    - cron: "50 11 * * 1-5"
      timezone: Europe/Amsterdam
    - cron: "50 13 * * 1-5"
      timezone: Europe/Amsterdam
    - cron: "50 15 * * 1-5"
      timezone: Europe/Amsterdam

jobs:
  build-linux:
    runs-on: "namespace-profile-linux-slim;job.priority=1"

    env:
      PAT_USER: ${{ secrets.PAT_USER }}
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
      EVENT_NAME: ${{ github.event_name }}
      EVENT_SCHEDULE: ${{ github.event.schedule }}
      TRIGGER_NIGHTLY: ${{ github.event.inputs.trigger-nightly }}
      SKIP_TESTS: ${{ github.event.inputs.skip_tests || 'false' }}
      DUCKDB_REF: ${{ github.event.inputs.duckdb-ref }}

    steps:
    - uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Config
      id: config
      run: uv run --no-project --python 3.11 python scripts/workflow_trigger.py config

    - name: Checkout DuckDB upstream repository
      if: ${{ fromJSON(steps.config.outputs.needs_upstream) }}
      uses: actions/checkout@v6
      with:
        repository: duckdb/duckdb
        fetch-depth: 0
        path: duckdb-upstream

    - name: Dispatch DuckDB workflows
      run: uv run --no-project --python 3.11 python scripts/workflow_trigger.py dispatch
