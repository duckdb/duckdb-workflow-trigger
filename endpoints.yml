defaults:
  # Endpoints inherit these inputs when they do not define their own inputs.
  inputs:
    duckdb-sha: "{duckdb_commit}"
    duckdb-version: "{duckdb_version}"

hooks:
  # Trigger downstream workflows after DuckDB core release artifacts are ready.
  # Group endpoints by downstream integration, then by DuckDB release line.
  core_ready:
    python:
      # An exact major.minor release line takes precedence over the major fallback.
      "2.0":
        # Format: workflow: owner/repo/workflow.yml@ref
        - workflow: duckdb/duckdb-python/release.yml@v2.0-cyanoptera
          # Explicit inputs replace the defaults, so this mapping repeats the
          # default values before adding the receiver-specific PyPI input.
          inputs:
            duckdb-sha: "{duckdb_commit}"
            duckdb-version: "{duckdb_version}"
            pypi-index: prod
      # A major release line matches other releases in that major version.
      "2":
        - workflow: duckdb/duckdb-python/release.yml@main
          inputs:
            duckdb-sha: "{duckdb_commit}"
            duckdb-version: "{duckdb_version}"
            pypi-index: prod
    java:
      "2.0":
        - workflow: duckdb/duckdb-java/Vendor.yml@v2.0-cyanoptera
      "2":
        - workflow: duckdb/duckdb-java/Vendor.yml@main
    odbc:
      "2.0":
        - workflow: duckdb/duckdb-odbc/Vendor.yml@v2.0-cyanoptera
      "2":
        - workflow: duckdb/duckdb-odbc/Vendor.yml@main
    benchmark:
      "2":
        - workflow: duckdblabs/duckdb-benchmark/Benchmark.yml@main

  # Trigger client-specific workflows after a client release is ready.
  # Group endpoints by client name so the payload matches the downstream release.
  client_ready:
    r:
      "2":
        - workflow: duckdb/duckdb-r/OnClientReady.yml@main
          # List form replaces the defaults and forwards same-named values.
          inputs:
            - duckdb_version
            - duckdb_commit
            - payload
