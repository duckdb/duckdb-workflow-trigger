name: Record DuckDB release status
description: Trigger the DuckDB release dispatcher workflow with release or check status metadata.

inputs:
  github_token:
    description: GitHub token allowed to dispatch duckdb/duckdb-workflow-trigger workflows.
    required: true
  event:
    description: Release event phase or check result, for example core_ready, client_ready, or check.
    required: true
  duckdb_version:
    description: Full DuckDB version.
    required: true
  duckdb_commit:
    description: Full DuckDB commit SHA.
    required: true
  status:
    description: Event status, for example success, failure, or skipped.
    required: true
  client:
    description: Deprecated client name alias for client_ready events.
    required: false
  name:
    description: Name for client_ready or check events.
    required: false
  source_run_url:
    description: URL of the workflow run that produced this status.
    required: false
  message:
    description: Human-readable status message.
    required: false

runs:
  using: composite
  steps:
    - name: Dispatch release status
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        DISPATCH_EVENT: ${{ inputs.event }}
        DISPATCH_DUCKDB_VERSION: ${{ inputs.duckdb_version }}
        DISPATCH_DUCKDB_COMMIT: ${{ inputs.duckdb_commit }}
        DISPATCH_STATUS: ${{ inputs.status }}
        DISPATCH_NAME: ${{ inputs.name }}
        DISPATCH_CLIENT: ${{ inputs.client }}
        DISPATCH_SOURCE_RUN_URL: ${{ inputs.source_run_url }}
        DISPATCH_MESSAGE: ${{ inputs.message }}
        DEFAULT_SOURCE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail

        name="$DISPATCH_NAME"
        case "$DISPATCH_EVENT" in
          core_ready)
            if [[ -n "$name" || -n "$DISPATCH_CLIENT" ]]; then
              echo "name and client must be omitted for core_ready" >&2
              exit 1
            fi
            ;;
          client_ready)
            if [[ -n "$name" && -n "$DISPATCH_CLIENT" && "$name" != "$DISPATCH_CLIENT" ]]; then
              echo "name and client must match when both are provided" >&2
              exit 1
            fi
            name="${name:-$DISPATCH_CLIENT}"
            if [[ -z "$name" ]]; then
              echo "name or client is required for client_ready" >&2
              exit 1
            fi
            ;;
          check)
            if [[ -n "$DISPATCH_CLIENT" ]]; then
              echo "client must be omitted for check" >&2
              exit 1
            fi
            if [[ -z "$name" ]]; then
              echo "name is required for check" >&2
              exit 1
            fi
            ;;
          *)
            echo "event must be core_ready, client_ready, or check" >&2
            exit 1
            ;;
        esac

        source_run_url="${DISPATCH_SOURCE_RUN_URL:-$DEFAULT_SOURCE_RUN_URL}"
        message="$DISPATCH_MESSAGE"
        if [[ -z "$message" ]]; then
          if [[ "$DISPATCH_EVENT" == "core_ready" ]]; then
            message="DuckDB core ready"
          elif [[ "$DISPATCH_EVENT" == "client_ready" ]]; then
            message="DuckDB ${name} client ready"
          elif [[ "$DISPATCH_EVENT" == "check" ]]; then
            message="DuckDB ${name} check"
          else
            message="DuckDB release state recorded"
          fi
        fi

        args=(
          workflow run dispatch.yml
          --repo duckdb/duckdb-workflow-trigger
          --ref main
          --field "event=$DISPATCH_EVENT"
          --field "duckdb_version=$DISPATCH_DUCKDB_VERSION"
          --field "duckdb_commit=$DISPATCH_DUCKDB_COMMIT"
          --field "status=$DISPATCH_STATUS"
          --field "source_run_url=$source_run_url"
          --field "message=$message"
        )

        if [[ -n "$name" ]]; then
          args+=(--field "name=$name")
        fi

        gh "${args[@]}"
